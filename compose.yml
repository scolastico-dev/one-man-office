name: omo

services:
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
      # DinD resolves bind mounts in its own filesystem namespace.
      - ${OMO_WORKSPACE:-.}:/workspace
    healthcheck:
      test: [CMD, docker, info]
      interval: 5s
      timeout: 3s
      retries: 20

  omo:
    image: ghcr.io/scolastico-dev/one-man-office:latest
    depends_on:
      docker:
        condition: service_healthy
    environment:
      OMO_UID: ${OMO_UID:-1000}
      OMO_GID: ${OMO_GID:-1000}
      OMO_AGENT_CLIS: ${OMO_AGENT_CLIS:-claude,codex,gemini}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      # Host shell: export OMO_UID="$(id -u)" OMO_GID="$(id -g)"
      # export OMO_SSH_KEY="$HOME/.ssh/id_ed25519" (must be readable, ideally 0600).
      # Then uncomment this setting and the read-only bind below.
      # GIT_SSH_COMMAND: ssh -i /run/secrets/git-key -o IdentitiesOnly=yes
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # INIT_SCRIPT_PATH: /config/init.sh
      # INIT_SCRIPT: apk add --no-cache your-extra-package
    volumes:
      - ${OMO_WORKSPACE:-.}:/workspace
      # Persists CLI credentials, NVM/npm/pnpm state, and ~/.local/omo.
      - ${OMO_USER_DIR:-./docker-data/home}:/home/omo
      - docker-certs-client:/certs/client:ro
      # Example read-only SSH identity for Git (also enable GIT_SSH_COMMAND above).
      # - ${OMO_SSH_KEY}:/run/secrets/git-key:ro
      # Mount a path initializer when INIT_SCRIPT_PATH is enabled above.
      # - ./init.sh:/config/init.sh:ro
    ports:
      # The supervisor grants command execution. Keep it on host loopback.
      - 127.0.0.1:${OMO_PORT:-8090}:8090
    restart: unless-stopped

volumes:
  docker-certs-ca:
  docker-certs-client:
  docker-data:
