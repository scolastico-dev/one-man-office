[package]
name = "omo-ui-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
httparse = "1.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
aes-gcm = "0.10.3"
getrandom = "0.4"
hkdf = "0.12.4"
hmac = "0.12.1"
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
subtle = "2.6"
zeroize = "1.8"
base64 = "0.22.1"
flate2 = "1.1"
humantime = "2"
sha2 = "0.10"
tar = "0.4"
serde_yaml = "0.9"
tempfile = "3.24.0"
wait-timeout = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
ml-kem = { version = "0.3.4", features = ["hazmat"] }
tempfile = "3.24.0"

[features]
relay-integration = []

[[test]]
name = "relay_native"
required-features = ["relay-integration"]

[[test]]
name = "relay_board"
required-features = ["relay-integration"]

[[test]]
name = "relay_notifications_live"
required-features = ["relay-integration"]
