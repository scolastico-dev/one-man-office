[package]
name = "omo-ui-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.24.0"
