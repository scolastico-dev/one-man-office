<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omo</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f3f6; --fg: #1a1a1a; --line: #8a8491; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #e8e8e8; --line: #75707a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.55 ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
  main { max-width: 36rem; margin: 16px; padding: 24px; border: 1px solid var(--line); }
  h1 { margin: 0 0 12px; font-size: 20px; }
  p { margin: 0; }
</style>
</head>
<body>
<main>
<h1>omo</h1>
<p>The board was not built into this omo binary. Build it with <code>make web</code> and rebuild omo, or use a release build.</p>
</main>
</body>
</html>
