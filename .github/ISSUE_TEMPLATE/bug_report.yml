name: Bug report
description: Report a reproducible problem with omo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove sensitive information before submitting. Do not paste office paths, repository names, secrets, or office mail contents.
  - type: input
    id: omo-version
    attributes:
      label: omo version
      description: Run `omo --version` (or the equivalent version command for your binary) and paste the exact output.
      placeholder: omo version 0.10.1
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: OS and architecture
      description: Include the operating system and CPU architecture.
      placeholder: Linux amd64
    validations:
      required: true
  - type: textarea
    id: provider-clis
    attributes:
      label: Provider CLI(s) and versions
      description: List each provider CLI involved and its version, or say none.
      placeholder: |
        codex 0.1.0
        claude 1.2.3
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact without including private paths or data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe sequence of commands or actions.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: relevant-output
    attributes:
      label: Relevant anonymised output
      description: Paste only sanitized logs or errors. Remove office paths, repository names, secrets, and office mail contents.
      render: text
    validations:
      required: false
