name: Publish container

on:
  workflow_call:
    inputs:
      channel:
        description: Image channel, either nightly or release
        required: true
        type: string
      version:
        description: Version stamped into the omo binary
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Validate image metadata
    runs-on: ubuntu-24.04
    outputs:
      release-version: ${{ steps.metadata.outputs.release-version }}
    steps:
      - name: Validate channel and version
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            nightly)
              echo "release-version=" >> "$GITHUB_OUTPUT"
              ;;
            release)
              release_version="${VERSION#v}"
              if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "release tag must be x.x.x or vx.x.x to publish a container" >&2
                exit 1
              fi
              echo "release-version=$release_version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown container channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

  build-platform:
    name: Build container (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish container manifest
    needs:
      - prepare
      - build-platform
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect multi-platform image
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release-version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("$IMAGE_NAME@sha256:${digest_file##*/}")
          done

          tags=()
          case "$CHANNEL" in
            nightly) tags+=(--tag "$IMAGE_NAME:nightly") ;;
            release)
              tags+=(--tag "$IMAGE_NAME:$RELEASE_VERSION")
              tags+=(--tag "$IMAGE_NAME:latest")
              ;;
          esac

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
