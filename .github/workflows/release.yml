name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build release binaries
        run: make cross VERSION="${{ github.event.release.tag_name }}"

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "bin/omo-${platform}" staging/omo
            tar -C staging -czf "dist/omo-${platform}.tar.gz" omo
          done

          for platform in windows-amd64 windows-arm64; do
            cp "bin/omo-${platform}.exe" staging/omo.exe
            (cd staging && zip -q "../dist/omo-${platform}.zip" omo.exe)
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Validate container version tag
        id: container-version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be x.x.x or vx.x.x to publish a container" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.container-version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: VERSION=${{ github.event.release.tag_name }}
