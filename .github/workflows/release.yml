name: Release

on:
  release:
    types:
      - published
  # The plugin list and the official plugins are read from the release
  # branch. This copies the plugins folder of a tag, branch or commit there
  # without a release (a list change, or the first sync).
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit whose plugins folder becomes the release branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: "${{ github.event.release.tag_name }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the board
        run: make web

      - name: Test
        run: make check

      - name: Build release binaries
        run: make cross VERSION="${{ github.event.release.tag_name }}"

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "bin/omo-${platform}" staging/omo
            tar -C staging -czf "dist/omo-${platform}.tar.gz" omo
          done

          for platform in windows-amd64 windows-arm64; do
            cp "bin/omo-${platform}.exe" staging/omo.exe
            (cd staging && zip -q "../dist/omo-${platform}.zip" omo.exe)
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber


  sync-plugin-release:
    name: Sync release plugin branch
    needs: build-and-publish
    if: >-
      !cancelled() && (needs.build-and-publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.build-and-publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the plugins' source
        uses: actions/checkout@v7
        with:
          ref: "${{ github.event.release.tag_name || inputs.ref }}"
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the plugin list and the official plugins
        run: go test ./internal/pluginmanager -run 'TestShippedCatalog' -count=1

      - name: Configure GitHub Actions identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync plugin tree to release branch
        shell: bash
        env:
          SOURCE_REF: "${{ github.event.release.tag_name || inputs.ref }}"
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"

          if git fetch origin release; then
            git switch --create release --track origin/release
          else
            git switch --orphan release
          fi

          git rm -rf . || true
          git clean -fdx
          git checkout "$source_commit" -- plugins
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(release): sync plugins for $SOURCE_REF"
          git push origin release


  publish-container:
    name: Publish release container
    needs: build-and-publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      channel: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
