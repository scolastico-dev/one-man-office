name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.release.tag_name }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build release binaries
        run: make cross VERSION="${{ github.event.release.tag_name }}"

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "bin/omo-${platform}" staging/omo
            tar -C staging -czf "dist/omo-${platform}.tar.gz" omo
          done

          for platform in windows-amd64 windows-arm64; do
            cp "bin/omo-${platform}.exe" staging/omo.exe
            (cd staging && zip -q "../dist/omo-${platform}.zip" omo.exe)
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber


  sync-plugin-release:
    name: Sync release plugin branch
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out published release tag
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.release.tag_name }}"
          fetch-depth: 0

      - name: Configure GitHub Actions identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync plugin tree to release branch
        shell: bash
        env:
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail

          if git fetch origin release; then
            git switch --create release --track origin/release
          else
            git switch --orphan release
          fi

          git rm -rf . || true
          git clean -fdx
          git checkout "$RELEASE_TAG" -- plugins
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(release): sync plugins for $RELEASE_TAG"
          git push origin release


  publish-container:
    name: Publish release container
    needs: build-and-publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      channel: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
