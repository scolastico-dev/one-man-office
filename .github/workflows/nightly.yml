name: Nightly

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .github/assets/*

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build nightly
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build all platforms
        run: make cross VERSION="nightly-${{ github.sha }}"

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: omo-nightly-${{ github.run_number }}
          path: bin/*
          if-no-files-found: error
          retention-days: 7
