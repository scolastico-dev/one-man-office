name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-for-recent-changes:
    name: Check for recent changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.recent-changes.outputs.should_run }}
    steps:
      - name: Check whether the nightly build is needed
        id: recent-changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              return;
            }

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.repository.default_branch,
              since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString(),
              per_page: 1,
            });
            core.setOutput('should_run', String(commits.data.length > 0));

  test-and-build:
    name: Test and build nightly
    needs: check-for-recent-changes
    if: needs.check-for-recent-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build all platforms
        run: make cross VERSION="nightly-${{ github.sha }}"

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: omo-nightly-${{ github.run_number }}
          path: bin/*
          if-no-files-found: error
          retention-days: 7


  publish-container:
    name: Publish nightly container
    needs:
      - check-for-recent-changes
      - test-and-build
    if: needs.check-for-recent-changes.outputs.should_run == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      channel: nightly
      version: nightly-${{ github.sha }}
    secrets: inherit
