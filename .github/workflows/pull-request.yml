name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the board
        run: make web

      - name: Test
        run: make check

      # The steps below run even when an earlier one failed, so that one run
      # reports every problem. The job fails when any step failed.
      - name: Test the board
        if: ${{ !cancelled() }}
        run: make web-check

      - name: Build all platforms
        if: ${{ !cancelled() }}
        run: make cross VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

  windows-test:
    name: Test Windows process containment
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet Windows code
        run: go vet ./...

      - name: Test on Windows
        if: ${{ !cancelled() }}
        run: go test ./... -timeout 900s

  container-build:
    name: Test container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --platform "${{ matrix.platform }}" --build-arg VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}" --tag omo:pr .

      - name: Test container entrypoint
        run: ./docker/entrypoint_test.sh omo:pr

      - name: Test Compose example
        run: ./docker/compose_test.sh
