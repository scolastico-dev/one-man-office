name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build all platforms
        run: make cross VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Upload pull-request build
        uses: actions/upload-artifact@v4
        with:
          name: omo-pr-${{ github.event.pull_request.number }}
          path: bin/*
          if-no-files-found: error
          retention-days: 1
