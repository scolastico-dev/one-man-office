name: Pull Request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the shells the shell-isolation tests drive
        run: sudo apt-get install -y --no-install-recommends bash zsh

      - name: Build the board
        run: make web

      - name: Test
        run: make check

      - name: Check the stress harness
        run: make stress-check

      - name: Test the board
        run: make web-check

      - name: Build all platforms
        run: make cross VERSION="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}"

  container-build:
    name: Test container (${{ matrix.arch }})
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --platform "${{ matrix.platform }}" --build-arg VERSION="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}" --tag omo:pr .

      - name: Test container entrypoint
        run: ./docker/entrypoint_test.sh omo:pr

      - name: Test Compose example
        run: ./docker/compose_test.sh
