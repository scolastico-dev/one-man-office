name: Pull Request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the shells the shell-isolation tests drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash zsh

      - name: Build the board
        run: make web

      - name: Test
        run: make check

      # The steps below run even when an earlier one failed, so that one run
      # reports every problem. The job fails when any step failed.
      - name: Check the stress harness
        if: ${{ !cancelled() }}
        run: make stress-check

      - name: Test the board
        if: ${{ !cancelled() }}
        run: make web-check

      - name: Build all platforms
        if: ${{ !cancelled() }}
        run: make cross VERSION="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}"

  # The Go test suite on Windows, in four groups that run side by side: every
  # program a test starts (git above all) is far slower to start there, and
  # in one job the largest packages ran into their time limit. Each package
  # is in exactly one group: the last group takes everything the others do
  # not name, and internal/archtest checks that its exclusions match them.
  windows-test:
    name: Test on Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: engine
            only: internal/(engine)
          - name: server
            only: internal/(server)
          - name: git and board
            only: internal/(gitops|board)
          - name: everything else
            except: internal/(engine|server|gitops|board)
            vet: true
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet Windows code
        if: ${{ matrix.vet }}
        run: go vet ./...

      - name: Test on Windows
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $all = go list ./...
          if ($LASTEXITCODE -ne 0) { throw "go list failed" }
          if ("${{ matrix.only }}") {
            $packages = @($all | Where-Object { $_ -match '/${{ matrix.only }}(/|$)' })
          } else {
            $packages = @($all | Where-Object { $_ -notmatch '/${{ matrix.except }}(/|$)' })
          }
          if ($packages.Count -eq 0) { throw "this group matches no package" }
          Write-Host "testing $($packages.Count) packages"
          go test $packages -timeout 900s
          exit $LASTEXITCODE

  container-build:
    name: Test container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --platform "${{ matrix.platform }}" --build-arg VERSION="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}" --tag omo:pr .

      - name: Test container entrypoint
        run: ./docker/entrypoint_test.sh omo:pr

      - name: Test Compose example
        run: ./docker/compose_test.sh
