name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the board
        run: make web

      - name: Test
        run: make check

      - name: Test the board
        run: make web-check

      - name: Build all platforms
        run: make cross VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the board
        run: make web

      - name: Get the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser download
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --prefix web playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx --prefix web playwright install-deps chromium

      - name: Run the browser tests
        run: make e2e

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: Test container (${{ matrix.arch }})
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --platform "${{ matrix.platform }}" --build-arg VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}" --tag omo:pr .

      - name: Test container entrypoint
        run: ./docker/entrypoint_test.sh omo:pr

      - name: Test Compose example
        run: ./docker/compose_test.sh
