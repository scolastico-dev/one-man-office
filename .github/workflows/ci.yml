name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  pull-request:
    name: Test and build pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build all platforms
        run: make cross VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Upload pull-request build
        uses: actions/upload-artifact@v4
        with:
          name: omo-pr-${{ github.event.pull_request.number }}
          path: bin/*
          if-no-files-found: error
          retention-days: 1

  nightly:
    name: Test and build nightly
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build all platforms
        run: make cross VERSION="nightly-${{ github.sha }}"

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: omo-nightly-${{ github.run_number }}
          path: bin/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make check

      - name: Build release binaries
        run: make cross VERSION="${{ github.event.release.tag_name }}"

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "bin/omo-${platform}" staging/omo
            tar -C staging -czf "dist/omo-${platform}.tar.gz" omo
          done

          for platform in windows-amd64 windows-arm64; do
            cp "bin/omo-${platform}.exe" staging/omo.exe
            (cd staging && zip -q "../dist/omo-${platform}.zip" omo.exe)
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
